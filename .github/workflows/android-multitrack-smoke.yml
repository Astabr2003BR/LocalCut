name: Android Multitrack Export Smoke

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/android-multitrack-smoke.yml'
      - 'overrides/app/src/main/java/com/localcut/editor/media/**'
      - 'overrides/app/src/androidTest/**'
      - 'localcut-source-full-build9.zip'
  push:
    branches: [main]
    paths:
      - '.github/workflows/android-multitrack-smoke.yml'
      - 'overrides/app/src/main/java/com/localcut/editor/media/**'
      - 'overrides/app/src/androidTest/**'
      - 'localcut-source-full-build9.zip'
  workflow_dispatch:

concurrency:
  group: localcut-android-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  multitrack-export-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify LocalCut source archive
        shell: bash
        run: |
          set -euo pipefail
          test -s localcut-source-full-build9.zip
          echo "b2610e666f4b1df80b8813e48f95809fa0406094b831cd1ab49baa07fa8b6878  localcut-source-full-build9.zip" | sha256sum -c -
          unzip -tq localcut-source-full-build9.zip

      - name: Assemble source with overrides
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work
          mkdir -p work
          unzip -q localcut-source-full-build9.zip -d work
          test -d overrides/app
          cp -R overrides/app/. work/app/
          test -f work/app/src/androidTest/java/com/localcut/editor/media/MultitrackExportSmokeTest.kt
          test -f work/app/src/androidTest/java/com/localcut/editor/media/FadeToBlackExportSmokeTest.kt
          test -f work/app/src/androidTest/java/com/localcut/editor/media/KeyframeExportSmokeTest.kt
          test -f work/app/src/androidTest/java/com/localcut/editor/bridge/security/AndroidKeystoreDeviceIdentitySmokeTest.kt
          test -f work/app/src/androidTest/java/com/localcut/editor/bridge/agent/MediaStoreBridgeExportSmokeTest.kt
          test -f work/app/src/androidTest/java/com/localcut/editor/bridge/agent/BridgeConnectionServiceSmokeTest.kt
          test -f work/app/src/androidTest/java/com/localcut/editor/mobile/MobileHandoffIntentFilterSmokeTest.kt
          test -f work/app/src/androidTest/java/com/localcut/editor/mobile/SharedMediaImportSmokeTest.kt

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
          cache-provider: basic

      - name: Install Android emulator system image
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          test -d "$SDK_ROOT/cmdline-tools"

          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager -perm -u+x -print -quit)"
          test -n "$SDKMANAGER"
          AVDMANAGER="$(dirname "$SDKMANAGER")/avdmanager"
          test -x "$AVDMANAGER"

          SYSTEM_IMAGE='system-images;android-35;google_apis;x86_64'
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "$SYSTEM_IMAGE" 'platform-tools' 'emulator'

          ADB="$SDK_ROOT/platform-tools/adb"
          EMULATOR="$SDK_ROOT/emulator/emulator"
          test -x "$ADB"
          test -x "$EMULATOR"

          AVD_HOME="$RUNNER_TEMP/localcut-avd"
          rm -rf "$AVD_HOME"
          mkdir -p "$AVD_HOME"
          export ANDROID_AVD_HOME="$AVD_HOME"
          echo no | "$AVDMANAGER" create avd --force --name localcut-ci --package "$SYSTEM_IMAGE"
          test -f "$AVD_HOME/localcut-ci.ini"
          test -d "$AVD_HOME/localcut-ci.avd"
          "$EMULATOR" -list-avds | grep -Fx 'localcut-ci'

          echo "ANDROID_AVD_HOME=$AVD_HOME" >> "$GITHUB_ENV"
          echo "LOCALCUT_ADB=$ADB" >> "$GITHUB_ENV"
          echo "LOCALCUT_EMULATOR=$EMULATOR" >> "$GITHUB_ENV"

      - name: Run real multitrack export, Bridge, mobile handoff, and share-import smoke on emulator
        shell: bash
        run: |
          set -euo pipefail
          ADB="${LOCALCUT_ADB:?LOCALCUT_ADB missing}"
          EMULATOR="${LOCALCUT_EMULATOR:?LOCALCUT_EMULATOR missing}"
          AVD_HOME="${ANDROID_AVD_HOME:?ANDROID_AVD_HOME missing}"
          test -x "$ADB"
          test -x "$EMULATOR"
          test -f "$AVD_HOME/localcut-ci.ini"
          test -d "$AVD_HOME/localcut-ci.avd"
          "$EMULATOR" -list-avds | grep -Fx 'localcut-ci'

          if [ -e /dev/kvm ]; then
            sudo chmod 666 /dev/kvm
          fi
          EMULATOR_LOG="$RUNNER_TEMP/localcut-emulator.log"
          "$EMULATOR" \
            -avd localcut-ci \
            -no-window \
            -no-audio \
            -no-boot-anim \
            -no-snapshot \
            -no-metrics \
            -gpu swiftshader_indirect \
            >"$EMULATOR_LOG" 2>&1 &
          EMULATOR_PID=$!
          cleanup() {
            "$ADB" emu kill >/dev/null 2>&1 || true
            kill "$EMULATOR_PID" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          device_ready=''
          for _ in $(seq 1 60); do
            if ! kill -0 "$EMULATOR_PID" >/dev/null 2>&1; then
              echo 'Android emulator process exited before ADB became ready' >&2
              cat "$EMULATOR_LOG" >&2 || true
              wait "$EMULATOR_PID" || true
              exit 1
            fi
            if [ "$("$ADB" get-state 2>/dev/null || true)" = 'device' ]; then
              device_ready='1'
              break
            fi
            sleep 2
          done
          if [ "$device_ready" != '1' ]; then
            echo 'Android emulator did not appear in ADB within 120 seconds' >&2
            "$ADB" devices -l >&2 || true
            cat "$EMULATOR_LOG" >&2 || true
            exit 1
          fi

          booted=''
          for _ in $(seq 1 120); do
            if ! kill -0 "$EMULATOR_PID" >/dev/null 2>&1; then
              echo 'Android emulator process exited before boot completed' >&2
              cat "$EMULATOR_LOG" >&2 || true
              wait "$EMULATOR_PID" || true
              exit 1
            fi
            booted="$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')"
            if [ "$booted" = '1' ]; then
              break
            fi
            sleep 2
          done
          if [ "$booted" != '1' ]; then
            "$ADB" devices -l >&2 || true
            cat "$EMULATOR_LOG" >&2 || true
            echo 'Android emulator did not finish booting within 240 seconds' >&2
            exit 1
          fi

          "$ADB" shell settings put global window_animation_scale 0
          "$ADB" shell settings put global transition_animation_scale 0
          "$ADB" shell settings put global animator_duration_scale 0
          "$ADB" shell input keyevent 82 || true

          gradle --no-daemon -p work connectedDebugAndroidTest \
            -Pandroid.testInstrumentationRunnerArguments.class=com.localcut.editor.media.MultitrackExportSmokeTest,com.localcut.editor.media.FadeToBlackExportSmokeTest,com.localcut.editor.media.KeyframeExportSmokeTest,com.localcut.editor.bridge.security.AndroidKeystoreDeviceIdentitySmokeTest,com.localcut.editor.bridge.agent.MediaStoreBridgeExportSmokeTest,com.localcut.editor.bridge.agent.BridgeConnectionServiceSmokeTest,com.localcut.editor.mobile.MobileHandoffIntentFilterSmokeTest,com.localcut.editor.mobile.SharedMediaImportSmokeTest

      - name: Upload instrumentation reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: localcut-multitrack-smoke-failure-${{ github.run_number }}
          path: |
            work/app/build/reports/androidTests
            work/app/build/outputs/androidTest-results
            ${{ runner.temp }}/localcut-emulator.log
          if-no-files-found: warn
          retention-days: 3
