name: Android Debug APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Unpack verified LocalCut snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work
          mkdir -p work
          unzip -q localcut-source.zip -d work
          test -f work/settings.gradle.kts
          test -f work/app/build.gradle.kts

      - name: Set up Gradle 9.5
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5'
          cache-provider: basic

      - name: Run Android unit tests and assemble debug APK
        shell: bash
        run: gradle --no-daemon -p work testDebugUnitTest assembleDebug

      - name: Verify debug APK exists
        shell: bash
        run: test -s work/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: localcut-debug-apk
          path: work/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
