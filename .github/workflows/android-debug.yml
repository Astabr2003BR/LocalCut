name: Android Runner Smoke

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Runner smoke check
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_OK"
          uname -a
          java -version || true
          gradle --version || true
