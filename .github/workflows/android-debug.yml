name: Android Debug APK

on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: localcut-android-debug-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify LocalCut Build 9 archive
        shell: bash
        run: |
          set -euo pipefail
          test -s localcut-source-full-build9.zip
          echo "b2610e666f4b1df80b8813e48f95809fa0406094b831cd1ab49baa07fa8b6878  localcut-source-full-build9.zip" | sha256sum -c -
          unzip -tq localcut-source-full-build9.zip

      - name: Unpack LocalCut Build 9
        shell: bash
        run: |
          set -euo pipefail
          rm -rf work
          mkdir -p work
          unzip -q localcut-source-full-build9.zip -d work
          test -f work/settings.gradle.kts
          test -f work/app/build.gradle.kts
          test -f work/localcut-debug.jks

      - name: Apply current LocalCut overrides
        shell: bash
        run: |
          set -euo pipefail
          test -d overrides/app
          cp -R overrides/app/. work/app/

          while IFS= read -r -d '' source; do
            relative="${source#overrides/app/}"
            target="work/app/$relative"
            test -f "$target"
            cmp -s "$source" "$target"
          done < <(find overrides/app -type f -print0)

          grep -F 'PickMultipleVisualMedia' work/app/src/main/java/com/localcut/editor/MainActivity.kt
          grep -F 'Dividir' work/app/src/main/java/com/localcut/editor/ui/editor/EditorScreen.kt
          grep -F 'TimelineEditBounds.clampLeft' work/app/src/main/java/com/localcut/editor/ui/editor/components/TimelinePane.kt
          grep -F 'TimelineEditBounds.clampRight' work/app/src/main/java/com/localcut/editor/ui/editor/components/TimelinePane.kt
          grep -F 'TimelineEditBounds.clampMove' work/app/src/main/java/com/localcut/editor/ui/editor/components/TimelinePane.kt
          grep -F 'fun leftTrimCannotCrossPreviousSplitClip()' work/app/src/test/java/com/localcut/editor/ui/editor/TimelineDragPlannerTestMain.kt

      - name: Stage sanitized assembled source audit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf source-audit
          mkdir -p source-audit/app
          cp -R work/app/src source-audit/app/src
          unzip -p localcut-source-full-build9.zip app/build.gradle.kts > source-audit/baseline-build.gradle.kts
          unzip -p localcut-source-full-build9.zip app/src/main/AndroidManifest.xml > source-audit/baseline-AndroidManifest.xml
          test -s source-audit/baseline-build.gradle.kts
          test -s source-audit/baseline-AndroidManifest.xml
          {
            echo '# LocalCut build configuration summary'
            grep -nE 'compileSdk|minSdk|targetSdk|applicationId|versionCode|versionName|testImplementation|androidTestImplementation' work/app/build.gradle.kts || true
          } > source-audit/build-config-summary.txt
          if find source-audit -type f \( -name '*.jks' -o -name '*.keystore' -o -name 'local.properties' \) | grep -q .; then
            echo 'Sensitive signing/config file found in source audit' >&2
            exit 1
          fi

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.5.0'
          cache-provider: basic

      - name: Run Android unit tests and assemble debug APK
        shell: bash
        run: gradle --no-daemon -p work testDebugUnitTest assembleDebug

      - name: Verify overlap-safe JUnit tests actually ran
        shell: bash
        run: |
          set -euo pipefail
          REPORT='work/app/build/test-results/testDebugUnitTest/TEST-com.localcut.editor.ui.editor.TimelineDragPlannerTest.xml'
          test -s "$REPORT"
          grep -F 'name="leftTrimCannotCrossPreviousSplitClip"' "$REPORT"
          grep -F 'name="rightTrimCannotCrossNextSplitClip"' "$REPORT"
          grep -F 'name="moveCannotCrossAdjacentClips"' "$REPORT"
          grep -F 'name="missingClipIsRejected"' "$REPORT"
          if grep -F '<failure' "$REPORT"; then
            echo 'TimelineDragPlannerTest contains failures' >&2
            exit 1
          fi

      - name: Verify all legacy regression harnesses actually ran
        shell: bash
        run: |
          set -euo pipefail
          REPORT='work/app/build/test-results/testDebugUnitTest/TEST-com.localcut.editor.LegacyHarnessRegressionTest.xml'
          test -s "$REPORT"
          python3 - <<'PY'
          import sys
          import xml.etree.ElementTree as ET

          report = 'work/app/build/test-results/testDebugUnitTest/TEST-com.localcut.editor.LegacyHarnessRegressionTest.xml'
          root = ET.parse(report).getroot()
          tests = int(root.attrib.get('tests', '0'))
          failures = int(root.attrib.get('failures', '0'))
          errors = int(root.attrib.get('errors', '0'))
          skipped = int(root.attrib.get('skipped', '0'))
          print(f'Legacy harnesses: tests={tests} failures={failures} errors={errors} skipped={skipped}')
          if (tests, failures, errors, skipped) != (23, 0, 0, 0):
              sys.exit('Expected exactly 23 passing legacy harnesses')
          PY

      - name: Verify critical Bridge unit regressions actually ran
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import sys
          import xml.etree.ElementTree as ET

          root = pathlib.Path('work/app/build/test-results/testDebugUnitTest')
          required = [
              'com.localcut.editor.bridge.protocol.BridgeProtocolTest',
              'com.localcut.editor.bridge.security.ReplayGuardTest',
              'com.localcut.editor.bridge.security.DeviceIdentityContractTest',
              'com.localcut.editor.bridge.transport.BridgeEndpointConfigTest',
              'com.localcut.editor.bridge.transport.BridgeConnectionCoordinatorTest',
              'com.localcut.editor.bridge.transport.BridgeReconnectPolicyTest',
              'com.localcut.editor.bridge.transport.BridgeSessionProviderTest',
              'com.localcut.editor.bridge.agent.BridgeEndpointPreferenceTest',
              'com.localcut.editor.bridge.agent.BridgeCommandExecutorTest',
              'com.localcut.editor.bridge.agent.BridgeAdvancedEditCommandsTest',
              'com.localcut.editor.bridge.agent.BridgeExportCommandTest',
              'com.localcut.editor.bridge.agent.BridgeJobRegistryTest',
              'com.localcut.editor.bridge.agent.BridgeMessageProcessorTest',
              'com.localcut.editor.bridge.agent.BridgePairingCoordinatorTest',
              'com.localcut.editor.bridge.agent.BridgeSettingsStoreTest',
              'com.localcut.editor.bridge.agent.BridgeUiStateTest',
              'com.localcut.editor.bridge.agent.Media3BridgeExportPortTest',
              'com.localcut.editor.bridge.agent.MediaStoreExportNamingPolicyTest',
          ]
          total = failures = errors = skipped = 0
          for class_name in required:
              report = root / f'TEST-{class_name}.xml'
              if not report.is_file() or report.stat().st_size == 0:
                  sys.exit(f'Missing Bridge test report: {report}')
              suite = ET.parse(report).getroot()
              tests = int(suite.attrib.get('tests', '0'))
              suite_failures = int(suite.attrib.get('failures', '0'))
              suite_errors = int(suite.attrib.get('errors', '0'))
              suite_skipped = int(suite.attrib.get('skipped', '0'))
              if tests <= 0:
                  sys.exit(f'Bridge suite executed zero tests: {class_name}')
              total += tests
              failures += suite_failures
              errors += suite_errors
              skipped += suite_skipped
          print(f'Bridge unit suites={len(required)} tests={total} failures={failures} errors={errors} skipped={skipped}')
          if failures or errors or skipped:
              sys.exit('Bridge unit regression gate failed')
          PY

      - name: Verify debug APK exists
        shell: bash
        run: test -s work/app/build/outputs/apk/debug/app-debug.apk

      - name: Read APK version metadata
        id: apk_meta
        shell: bash
        run: |
          set -euo pipefail
          META='work/app/build/outputs/apk/debug/output-metadata.json'
          test -s "$META"
          VERSION_CODE="$(python3 -c 'import json; d=json.load(open("work/app/build/outputs/apk/debug/output-metadata.json")); print(d["elements"][0]["versionCode"])')"
          VERSION_NAME="$(python3 -c 'import json; d=json.load(open("work/app/build/outputs/apk/debug/output-metadata.json")); print(d["elements"][0]["versionName"])')"
          test -n "$VERSION_CODE"
          test -n "$VERSION_NAME"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "APK versionName=$VERSION_NAME versionCode=$VERSION_CODE"

      - name: Upload debug APK
        uses: actions/upload-artifact@v7
        with:
          name: localcut-debug-apk-v${{ steps.apk_meta.outputs.version_name }}-code${{ steps.apk_meta.outputs.version_code }}
          path: work/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload sanitized source audit
        uses: actions/upload-artifact@v7
        with:
          name: localcut-source-audit-run-${{ github.run_number }}
          path: source-audit
          if-no-files-found: error
          retention-days: 2
