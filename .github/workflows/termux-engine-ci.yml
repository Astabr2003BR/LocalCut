name: Termux Agent Engine CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'termux-engine/**'
      - '.github/workflows/termux-engine-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Test read-only Termux engine contract
        shell: bash
        run: |
          set -euo pipefail
          PYTHONWARNINGS='error::ResourceWarning' python3 -m unittest discover -s termux-engine/tests -p 'test_*.py' -v
